name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    # mlx-swift-lm 3.x and its dependencies need Swift tools 6.3–6.4 (Xcode 26.x).
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7

    - name: Select the latest stable Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install Metal Toolchain
      # MLX Code bundles mlx-swift, which compiles Metal shaders; recent Xcode no
      # longer ships the Metal Toolchain by default, so the build fails without this.
      run: xcodebuild -downloadComponent MetalToolchain || true

    - name: Build & Test
      run: |
        set -o pipefail
        xcodebuild test \
          -project "MLX Code.xcodeproj" \
          -scheme "MLX Code" \
          -destination 'platform=macOS' \
          -skipMacroValidation \
          -skipPackagePluginValidation \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          | tail -60
